# Porte unique (scripts/check.py) sous Linux et Windows, et signature DCO sur chaque demande de fusion.
# Aucun secret requis. Les scénarios d'interface Playwright (scripts/check_ui.py) restent hors CI :
# ils demandent un navigateur et un vrai serveur, et se jouent en local.
name: porte

on:
  pull_request:
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  porte:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # Windows : le code pilote des processus (taskkill, pwsh)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: python -m pip install fastapi==0.115.0 uvicorn==0.48.0 PyYAML==6.0.3 httpx==0.28.1 pytest==8.3.3
      - name: Porte
        run: python scripts/check.py

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Chaque commit porte Signed-off-by
        shell: bash
        run: |
          manquants=0
          for c in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $c sans Signed-off-by (git commit -s, voir CONTRIBUTING.md)"
              manquants=1
            fi
          done
          exit $manquants
